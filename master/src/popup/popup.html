<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebTranslate HaYTooL</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <img src="../assets/icons/icon32.png" alt="Logo" class="logo-img">
        <div>
          <h1 class="title" data-i18n="popupTitle">WebTranslate HaYTooL</h1>
          <p class="subtitle" data-i18n="popupSubtitle">Işık hızında sayfa ve metin çevirisi</p>
        </div>
      </div>
      <button id="btn-settings" class="icon-btn" title="Ayarlar" data-i18n-title="settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <!-- Hızlı Eylemler (Sayfa Çevirisi) -->
    <div class="actions-card">
      <div class="lang-selector-row">
        <label for="select-target-lang" class="label" data-i18n="targetLanguage">Hedef Dil</label>
        <select id="select-target-lang" class="select-box">
          <option value="tr">🇹🇷 Türkçe</option>
          <option value="en">🇬🇧 English</option>
          <option value="az">🇦🇿 Azərbaycan</option>
          <option value="de">🇩🇪 Deutsch</option>
          <option value="fr">🇫🇷 Français</option>
          <option value="es">🇪🇸 Español</option>
          <option value="it">🇮🇹 Italiano</option>
          <option value="pt">🇵🇹 Português</option>
          <option value="ru">🇷🇺 Русский</option>
          <option value="uk">🇺🇦 Українська</option>
          <option value="pl">🇵🇱 Polski</option>
          <option value="nl">🇳🇱 Nederlands</option>
          <option value="ar">🇸🇦 العربية</option>
          <option value="ja">🇯🇵 日本語</option>
          <option value="ko">🇰🇷 한국어</option>
          <option value="zh">🇨🇳 中文</option>
        </select>
      </div>

      <!-- Çeviri Motoru Seçici (Favicon İkonlu 5 Motor) -->
      <div class="engine-selector-row">
        <label class="label" data-i18n="translationEngine">Motor</label>
        <div class="popup-engine-pills">
          <button type="button" class="engine-pill active" data-engine="google" title="Google Translate">
            <img src="../assets/icons/engine-google.png" alt="Google" class="pill-favicon">
            <span>Google</span>
          </button>
          <button type="button" class="engine-pill" data-engine="deepl" title="DeepL Translate">
            <img src="../assets/icons/engine-deepl.png" alt="DeepL" class="pill-favicon">
            <span>DeepL</span>
          </button>
          <button type="button" class="engine-pill" data-engine="bing" title="Bing Translator">
            <img src="../assets/icons/engine-bing.png" alt="Bing" class="pill-favicon">
            <span>Bing</span>
          </button>
          <button type="button" class="engine-pill" data-engine="mymemory" title="MyMemory">
            <img src="../assets/icons/engine-mymemory.png" alt="MyMemory" class="pill-favicon">
            <span>MyMem</span>
          </button>
          <button type="button" class="engine-pill" data-engine="duckduckgo" title="DuckDuckGo Translate">
            <img src="../assets/icons/engine-duckduckgo.png" alt="DuckDuckGo" class="pill-favicon">
            <span>DDG</span>
          </button>
          <button type="button" class="engine-pill" data-engine="lingva" title="Lingva Translate">
            <img src="../assets/icons/engine-lingva.png" alt="Lingva" class="pill-favicon">
            <span>Lingva</span>
          </button>
        </div>
      </div>

      <div class="btn-group">
        <button id="btn-translate-page" class="primary-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          <span data-i18n="btnTranslatePage">Bu Sayfayı Çevir</span>
        </button>

        <button id="btn-restore-page" class="secondary-btn" title="Orijinal Sayfayı Göster">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="1 4 1 10 7 10"></polyline>
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
          </svg>
          <span data-i18n="btnRestorePage">Orijinal Sayfa</span>
        </button>
      </div>
    </div>

    <!-- Hızlı Metin Çevirici Kutusu -->
    <div class="quick-translate-card">
      <div class="textarea-wrapper">
        <textarea id="quick-input" rows="2" data-i18n-placeholder="quickTranslatePlaceholder" placeholder="Hızlı çevrilecek metni yazın..."></textarea>
        <button id="btn-quick-translate" class="send-btn" title="Çevir">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>

      <div id="quick-result-card" class="result-box hidden">
        <div class="result-header">
          <span class="badge">Sonuç</span>
          <button id="btn-copy-result" class="copy-btn" title="Kopyala">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </button>
        </div>
        <p id="quick-result-text"></p>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
